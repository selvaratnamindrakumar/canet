# ─── Thread pool ─────────────────────────────────────────────────────
num.threads=8
queue.size=5000

# ─── Network capture ─────────────────────────────────────────────────
# Name or IP of the capture interface (e.g. eth0, 10.0.0.1).
# Leave blank to auto-select the first non-loopback interface.
network.interface=

# ─── Duplicate detection window ──────────────────────────────────────
# Only messages whose received_at falls within the last N seconds are
# considered when checking whether a hash already exists.
# This keeps the DB query bounded regardless of historical data volume.
#
#   60      — 1-minute window
#   3600    — 1-hour window   (default)
#   86400   — 24-hour window
#   604800  — 7-day window
dedup.window.seconds=3600

# ─── Database ────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/canet?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=canet
spring.datasource.password=canet
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=4
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=300000

# ─── JPA ─────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ─── Server SSL (validator HTTPS endpoint) ───────────────────────────
# Enable when a certificate is available so Diosma can reach the validator
# over HTTPS instead of HTTP.  Leave disabled for plain HTTP deployments.
#
# To enable:
#   1. Place keystore.p12 and truststore.p12 in /etc/canet/ (or classpath:)
#   2. Uncomment the lines below and set the passwords
#
#server.ssl.enabled=true
#server.ssl.key-store=/etc/canet/keystore.p12
#server.ssl.key-store-password=changeit
#server.ssl.key-store-type=PKCS12
#server.ssl.trust-store=/etc/canet/truststore.p12
#server.ssl.trust-store-password=changeit
#server.ssl.trust-store-type=PKCS12
#server.ssl.client-auth=want

# ─── Outbound SSL (generator → validator when deployed separately) ───
# Set these when the generator must call the validator's REST endpoints
# over mutual TLS.  Leave blank for plain HTTP or JVM-default trust.
#
#ssl.keystore.path=/etc/canet/keystore.p12
#ssl.keystore.password=changeit
#ssl.keystore.type=PKCS12
#ssl.truststore.path=/etc/canet/truststore.p12
#ssl.truststore.password=changeit
#ssl.truststore.type=PKCS12

# ─── Logging ─────────────────────────────────────────────────────────
# Switch to WARN during load testing to reduce disk I/O pressure.
logging.level.root=INFO
logging.level.com.canet.udplistener=INFO
