# ─── Thread pool ────────────────────────────────────────────────────
# Increase from original 2 → 8 to handle bursty UDP traffic
num.threads=8

# Increase from original 100 → 5000 to prevent CallerRunsPolicy
# from blocking the pcap capture thread under load
queue.size=5000

# ─── Network ─────────────────────────────────────────────────────────
# Name of the interface to capture on (e.g. eth0, en0)
# Leave blank to auto-select first non-loopback interface
network.interface=

# OS-level UDP receive buffer in bytes (16 MB)
udp.receive.buffer.size=16777216

# ─── Database ────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/canet?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=canet
spring.datasource.password=canet
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool (HikariCP) — size matters for DB throughput
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=4
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=300000

# ─── JPA ─────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ─── Logging ─────────────────────────────────────────────────────────
# Use WARN for production load testing to eliminate I/O pressure from logging
logging.level.root=INFO
logging.level.com.canet.udplistener=INFO
