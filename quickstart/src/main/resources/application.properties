# ─── Thread pool ─────────────────────────────────────────────────────
# Raised from original 2 → 8 to handle bursty UDP traffic.
# Rule of thumb: if HTTP/DB avg latency = L ms, max throughput = (num.threads * 1000/L) msg/s
num.threads=8

# Raised from original 100 → 5000.
# At 500 msg/s a queue of 100 fills in 0.2 s; 5000 gives 10 s of headroom.
queue.size=5000

# ─── Network ─────────────────────────────────────────────────────────
# Name or IP of the capture interface (e.g. eth0, 10.0.0.1).
# Leave blank to auto-select the first non-loopback interface.
network.interface=

# ─── Database ────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/canet?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=canet
spring.datasource.password=canet
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP — pool must be large enough that DB latency * pool_size > msg/s
# Default 10 supports ~100 msg/s at 100 ms/insert; raise to 20 for higher throughput.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=4
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=300000

# ─── JPA ─────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Store Instant as UTC TIMESTAMP(6) — microsecond precision for receivedAt
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ─── Logging ─────────────────────────────────────────────────────────
# Switch to WARN during load testing to eliminate disk I/O pressure.
logging.level.root=INFO
logging.level.com.canet.udplistener=INFO
