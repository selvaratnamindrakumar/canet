# =============================================================================
#  Generic Message Forwarder — application.properties
#
#  One instance = one source type.
#  Run multiple containers with different source.type values to fan-in
#  several sources to the same endpoint.
# =============================================================================

# ── Application ──────────────────────────────────────────────────────────────
spring.application.name=generic-forwarder

# ── Camel ─────────────────────────────────────────────────────────────────────
camel.springboot.name=GenericForwarder
# Keep Camel alive in the background
camel.springboot.main-run-controller=true

# ── Source selection ──────────────────────────────────────────────────────────
# One of: kafka | rabbitmq | smb | file
source.type=file

# =============================================================================
# KAFKA  (source.type=kafka)
# =============================================================================
source.kafka.bootstrap-servers=localhost:9092
source.kafka.topic=forwarder-input
source.kafka.group-id=generic-forwarder
source.kafka.auto-offset-reset=earliest

# =============================================================================
# RABBITMQ  (source.type=rabbitmq)
# =============================================================================
source.rabbitmq.host=localhost
source.rabbitmq.port=5672
source.rabbitmq.username=guest
source.rabbitmq.password=guest
source.rabbitmq.virtual-host=/
source.rabbitmq.queue=forwarder-input
source.rabbitmq.prefetch-count=10

# =============================================================================
# SMB  (source.type=smb)
# =============================================================================
source.smb.host=smb-server
source.smb.share=myshare
source.smb.directory=/incoming
source.smb.username=smbuser
source.smb.password=smbpass
source.smb.domain=WORKGROUP
source.smb.file-pattern=*.*
source.smb.poll-delay=5000
source.smb.delete-after-read=false

# =============================================================================
# FILE  (source.type=file)
# =============================================================================
source.file.directory=/data/incoming
source.file.file-pattern=(?i).*\\.(log|xml|json|txt|csv|ndjson)$
source.file.recursive=false
source.file.poll-delay=5000
source.file.done-directory=.done

# =============================================================================
# INPUT SSL  (Kafka SSL / RabbitMQ SSL)
# =============================================================================
source.ssl.enabled=false
source.ssl.keystore-path=/certs/input-keystore.jks
source.ssl.keystore-password=changeit
source.ssl.keystore-type=JKS
source.ssl.truststore-path=/certs/input-truststore.jks
source.ssl.truststore-password=changeit
source.ssl.truststore-type=JKS

# =============================================================================
# ENDPOINT
# =============================================================================
endpoint.url=https://api.example.com/ingest
endpoint.feed=my-feed
endpoint.environment=dev
endpoint.content-type=application/octet-stream
endpoint.connect-timeout-ms=5000
endpoint.socket-timeout-ms=30000
endpoint.max-retries=3
endpoint.retry-delay-ms=2000

# OUTPUT SSL  (mutual TLS to HTTPS endpoint)
endpoint.ssl.enabled=false
endpoint.ssl.keystore-path=/certs/output-keystore.jks
endpoint.ssl.keystore-password=changeit
endpoint.ssl.keystore-type=JKS
endpoint.ssl.truststore-path=/certs/output-truststore.jks
endpoint.ssl.truststore-password=changeit
endpoint.ssl.truststore-type=JKS

# =============================================================================
# LOGGING
# =============================================================================
logging.level.com.canet.forwarder=INFO
logging.level.org.apache.camel=WARN
logging.level.org.springframework.integration=WARN
