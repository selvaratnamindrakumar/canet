# =============================================================================
#  Generic Message Forwarder — application.properties
#
#  One instance = one source type.
#  Run multiple containers with different source.type values to fan-in
#  several sources to the same endpoint.
# =============================================================================

# ── Application ──────────────────────────────────────────────────────────────
spring.application.name=generic-forwarder

# ── Camel ─────────────────────────────────────────────────────────────────────
camel.springboot.name=GenericForwarder
camel.springboot.main-run-controller=true

# ── Source selection ──────────────────────────────────────────────────────────
# One of: kafka | rabbitmq | smb | file
source.type=file

# =============================================================================
# KAFKA  (source.type=kafka)
# =============================================================================

# ── Connection ────────────────────────────────────────────────────────────────
source.kafka.bootstrap-servers=localhost:9092
source.kafka.topic=forwarder-input
source.kafka.group-id=generic-forwarder

# ── Consumer behaviour ────────────────────────────────────────────────────────
# earliest | latest | none
source.kafka.auto-offset-reset=earliest
# Max records returned per poll() invocation
source.kafka.max-poll-records=500
# Max ms between two consecutive poll() calls before broker considers consumer dead
source.kafka.max-poll-interval-ms=300000
# Heartbeat / session detection
source.kafka.session-timeout-ms=30000
source.kafka.heartbeat-interval-ms=10000

# ── Network / timeouts ────────────────────────────────────────────────────────
source.kafka.request-timeout-ms=30000
source.kafka.connection-max-idle-ms=540000
source.kafka.reconnect-backoff-ms=50
source.kafka.reconnect-backoff-max-ms=1000

# ── Fetch tuning ──────────────────────────────────────────────────────────────
source.kafka.fetch-min-bytes=1
source.kafka.fetch-max-wait-ms=500

# ── Security ──────────────────────────────────────────────────────────────────
# PLAINTEXT | SSL | SASL_PLAINTEXT | SASL_SSL
source.kafka.security-protocol=PLAINTEXT

# SASL – only required when security-protocol is SASL_PLAINTEXT or SASL_SSL
# PLAIN | SCRAM-SHA-256 | SCRAM-SHA-512 | GSSAPI
source.kafka.sasl-mechanism=PLAIN
# Full JAAS config string (keep on one line or use \ continuation)
# source.kafka.sasl-jaas-config=org.apache.kafka.common.security.plain.PlainLoginModule \
#   required username="kafkauser" password="kafkapass";

# =============================================================================
# RABBITMQ  (source.type=rabbitmq)
# =============================================================================

# ── Connection ────────────────────────────────────────────────────────────────
source.rabbitmq.host=localhost
# Use 5671 for AMQPS (SSL)
source.rabbitmq.port=5672
source.rabbitmq.username=guest
source.rabbitmq.password=guest
source.rabbitmq.virtual-host=/
source.rabbitmq.queue=forwarder-input

# ── Timeouts ──────────────────────────────────────────────────────────────────
source.rabbitmq.connection-timeout-ms=10000

# ── Keep-alive ────────────────────────────────────────────────────────────────
# Heartbeat interval in seconds (0 = disabled)
source.rabbitmq.requested-heartbeat=60
# Max channels per connection (0 = broker default)
source.rabbitmq.requested-channel-max=0

# ── Consumer concurrency ──────────────────────────────────────────────────────
# Max unacknowledged messages per consumer thread
source.rabbitmq.prefetch-count=10
source.rabbitmq.concurrent-consumers=1
source.rabbitmq.max-concurrent-consumers=5

# ── Reliability ───────────────────────────────────────────────────────────────
# Interval between reconnection attempts (ms)
source.rabbitmq.recovery-interval-ms=5000

# =============================================================================
# SMB  (source.type=smb)
# =============================================================================

# ── Connection ────────────────────────────────────────────────────────────────
source.smb.host=smb-server
# Default SMB port is 445; use 139 for legacy NetBIOS
source.smb.port=445
source.smb.share=myshare
source.smb.directory=/incoming
source.smb.username=smbuser
source.smb.password=smbpass
source.smb.domain=WORKGROUP

# ── Protocol version ──────────────────────────────────────────────────────────
# SMB1 | SMB2 | SMB3
source.smb.min-version=SMB2
source.smb.max-version=SMB3
# ── Polling / file handling ───────────────────────────────────────────────────
source.smb.file-pattern=*.*
source.smb.poll-delay=5000
# 0 = unlimited
source.smb.max-files-per-poll=0
source.smb.delete-after-read=false
# Local staging dir for synchronised files (empty = OS temp dir / smb-staging)
source.smb.local-staging-directory=

# =============================================================================
# FILE  (source.type=file)
# =============================================================================

# ── Location ──────────────────────────────────────────────────────────────────
source.file.directory=/data/incoming
source.file.file-pattern=(?i).*\\.(log|xml|json|txt|csv|ndjson)$
source.file.recursive=false

# ── Polling ───────────────────────────────────────────────────────────────────
source.file.poll-delay=5000
# 0 = unlimited files per poll cycle
source.file.max-files-per-poll=0

# ── Post-processing ───────────────────────────────────────────────────────────
# Sub-directory (relative to source.file.directory) for processed files.
# Leave empty to delete after forwarding.
source.file.done-directory=.done

# ── Size guard ────────────────────────────────────────────────────────────────
# Skip files larger than this (bytes). 0 = no limit.
source.file.max-file-size-bytes=0

# =============================================================================
# INPUT SSL  (Kafka SSL/SASL_SSL  ·  RabbitMQ AMQPS)
# =============================================================================
source.ssl.enabled=false
source.ssl.keystore-path=/certs/input-keystore.jks
source.ssl.keystore-password=changeit
source.ssl.keystore-type=JKS
source.ssl.truststore-path=/certs/input-truststore.jks
source.ssl.truststore-password=changeit
source.ssl.truststore-type=JKS

# =============================================================================
# ENDPOINT
# =============================================================================
endpoint.url=https://api.example.com/ingest
endpoint.feed=my-feed
endpoint.environment=dev
endpoint.content-type=application/octet-stream
endpoint.connect-timeout-ms=5000
endpoint.socket-timeout-ms=30000
endpoint.max-retries=3
endpoint.retry-delay-ms=2000

# OUTPUT SSL  (mutual TLS to HTTPS endpoint)
endpoint.ssl.enabled=false
endpoint.ssl.keystore-path=/certs/output-keystore.jks
endpoint.ssl.keystore-password=changeit
endpoint.ssl.keystore-type=JKS
endpoint.ssl.truststore-path=/certs/output-truststore.jks
endpoint.ssl.truststore-password=changeit
endpoint.ssl.truststore-type=JKS

# =============================================================================
# LOGGING
# =============================================================================
logging.level.com.canet.forwarder=INFO
logging.level.org.apache.camel=WARN
logging.level.org.springframework.integration=WARN
