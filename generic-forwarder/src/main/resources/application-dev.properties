# =============================================================================
#  Dev profile — generic-forwarder
#
#  Activate with:  --spring.profiles.active=dev
#  or set env var: SPRING_PROFILES_ACTIVE=dev
#
#  Two dev modes available — pick one:
#
#  MODE A (recommended for quick local testing):
#    mock-endpoint runs on HTTP (port 8080, no SSL).
#    No certificates needed at all.
#
#  MODE B (test SSL path end-to-end with test stores):
#    mock-endpoint runs on HTTPS (port 8443).
#    Run setup-endpoint-ssl.sh first to create the stores.
#    endpoint.ssl.dev-trust-all=true bypasses cert/hostname validation
#    so self-signed localhost certs are accepted.
# =============================================================================

# ── MODE A — plain HTTP to mock-endpoint (no SSL) ────────────────────────────
endpoint.url=http://localhost:8080/ingest
endpoint.ssl.enabled=false

# ── MODE B — HTTPS with dev trust-all (comment MODE A, uncomment MODE B) ─────
#endpoint.url=https://localhost:8443/ingest
#endpoint.ssl.enabled=true
#endpoint.ssl.dev-trust-all=true

# ── Dev-friendly source: poll a local folder ──────────────────────────────────
source.type=file
source.file.directory=${java.io.tmpdir}/forwarder-dev-input
source.file.poll-delay=2000

# ── Verbose logging in dev ────────────────────────────────────────────────────
logging.level.com.canet.forwarder=DEBUG
logging.level.org.apache.camel=INFO
logging.level.org.springframework.integration=INFO
