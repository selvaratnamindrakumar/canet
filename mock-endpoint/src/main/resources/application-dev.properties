# =============================================================================
#  Dev profile — mock-endpoint
#
#  Activate with:  --spring.profiles.active=dev
#  or set env var: SPRING_PROFILES_ACTIVE=dev
#
#  Runs on plain HTTP (port 8080) so no certificate setup is needed
#  when testing locally on the same host.
# =============================================================================

server.port=8080
server.ssl.enabled=false

logging.level.com.canet.mockendpoint=DEBUG
