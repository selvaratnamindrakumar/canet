# =============================================================================
#  Mock Endpoint — application.properties
#
#  Run with:
#    java -jar mock-endpoint.jar
#
#  All SSL paths and passwords can be overridden via environment variables,
#  e.g.:
#    SERVER_SSL_KEY_STORE=file:/certs/endpoint-server.p12
#    SERVER_SSL_KEY_STORE_PASSWORD=mysecret
#    SERVER_SSL_CLIENT_AUTH=NEED    # enable mTLS
# =============================================================================

spring.application.name=mock-endpoint

# ── Server ─────────────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8443}

# ── HTTPS / TLS ────────────────────────────────────────────────────────────
server.ssl.enabled=true
server.ssl.protocol=TLS

# Server keystore  (created by setup-endpoint-ssl.sh)
server.ssl.key-store=${SERVER_SSL_KEY_STORE:file:/certs/endpoint-server.p12}
server.ssl.key-store-password=${SERVER_SSL_KEY_STORE_PASSWORD:changeit}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=endpoint-server

# Server truststore  (needed only when client-auth is WANT or NEED)
server.ssl.trust-store=${SERVER_SSL_TRUST_STORE:file:/certs/endpoint-truststore.p12}
server.ssl.trust-store-password=${SERVER_SSL_TRUST_STORE_PASSWORD:changeit}
server.ssl.trust-store-type=PKCS12

# Client certificate policy:
#   NONE  – one-way TLS (server cert only, no client cert required)
#   WANT  – request client cert but don't fail if absent
#   NEED  – require client cert (full mTLS)
server.ssl.client-auth=${SERVER_SSL_CLIENT_AUTH:NONE}

# Minimum TLS version
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3

# ── Actuator ───────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ── Logging ────────────────────────────────────────────────────────────────
logging.level.com.canet.mockendpoint=INFO
