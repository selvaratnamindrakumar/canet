# ─── Server ──────────────────────────────────────────────────────────────────
# Diosma runs on 8090 — clear of the validator (8080 HTTP / 8443 HTTPS)
server.port=8090

# ─── Validator connection ─────────────────────────────────────────────────────
# Plain HTTP (validator SSL off, same box):
validator.base-url=http://localhost:8080

# HTTPS (validator SSL on, same box — also set trust-all=true or import the cert):
# validator.base-url=https://localhost:8443

# Set true to accept the validator's self-signed certificate without importing it.
# Safe only for testing on a trusted network — never use in production.
validator.ssl.trust-all=false

# ─── Log file ─────────────────────────────────────────────────────────────────
logging.file.name=logs/canet-diosma.log
logging.logback.rollingpolicy.file-name-pattern=logs/canet-diosma.%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14

# ─── Log format ───────────────────────────────────────────────────────────────
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %-40.40logger{39} : %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %-40.40logger{39} : %msg%n

# ─── Log levels ───────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.canet.diosma=INFO
logging.level.org.springframework=WARN
