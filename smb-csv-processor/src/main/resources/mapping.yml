# =============================================================================
# UK Telecom Cell Site — Field Mapping Configuration
# IE/AA Export Format: all headers and values are quoted uppercase
#   e.g.  "MCC","MNC","LAC","CELL_ID",...
#
# outputFormat: QUOTED_UPPERCASE  →  IE/AA export spec (default)
#               STANDARD          →  plain CSV
#
# Field keys:
#   sourceColumnName   - header in the source CSV (case-insensitive match)
#   targetColumnName   - output column header (upper-cased + quoted in IE/AA format)
#   inputFields        - source columns fed into a formula (multi-input fields)
#   formula            - calculateNodebId | calculateTac | calculateIpAddress |
#                        calculatePci | calculateCbMhz | deriveEci |
#                        deriveLatitude | deriveLongitude
#   expectedType       - STRING | INTEGER | DECIMAL | BOOLEAN
#   nullable           - true = field may be empty; false = empty row → quarantine
#   transformations    - TRIM | UPPERCASE | LOWERCASE | REMOVE_SPACES |
#                        NUMERIC_ONLY | REMOVE_NON_PRINTABLE
#   validation:
#     range:           - inclusive numeric range  { min: "x", max: "y" }
#     pattern:         - Java regex (full-string match via String.matches)
#     minLength / maxLength
#     allowedValues:   - exhaustive accepted list
#
# Formula fields (generation-aware):
#   calculateNodebId   → ENODEB_ID:  4G=enodeb_id,        5G=gnodeb_id
#   calculateTac       → TAC:        4G=4g_tac,            5G=5g_tac
#   calculateIpAddress → IP_ADDRESS: 4G=4g_enb_ip_address, 5G=5g_gnb_ip_address
#   calculatePci       → PCI:        4G=4g_pci (0-503),    5G=5g_pci (0-1007)
#   calculateCbMhz     → CB_MHZ:     4G=4g_cb_mhz,         5G=5g_cb_mhz
#   deriveEci          → DERIVED_ECI:
#       4G: eNB_ID × 256 + (cell_id & 0xFF)
#       5G: gNB_ID × 2^(36 − gNB_ID_length) + cell_id  [BigInteger]
#   deriveLatitude / deriveLongitude → BNG easting+northing → WGS84
#
# NOT MAPPED (present in source, used by formulas, not written to output):
#   gnodeb_id_lenth, 5g_amf_id
# =============================================================================

mapping:

  # ---- Source file format ---------------------------------------------------
  inputDelimiter: ","
  hasHeader: true
  encoding: "UTF-8"
  skipLines: 0

  # ---- Output file format ---------------------------------------------------
  outputDelimiter: ","
  outputFormat: QUOTED_UPPERCASE      # IE/AA export: "MCC","MNC",...

  # ---- Field definitions ----------------------------------------------------
  fields:

    # ==========================================================================
    # Network identity
    # ==========================================================================

    - sourceColumnName: "mcc"
      targetColumnName: "MCC"
      expectedType: INTEGER
      nullable: false
      transformations: [TRIM]
      validation:
        range:
          min: "1"
          max: "999"

    - sourceColumnName: "mnc"
      targetColumnName: "MNC"
      expectedType: INTEGER
      nullable: false
      transformations: [TRIM]
      validation:
        range:
          min: "0"
          max: "999"

    - sourceColumnName: "lac"
      targetColumnName: "LAC"
      expectedType: INTEGER
      nullable: true
      transformations: [TRIM]
      validation:
        range:
          min: "0"
          max: "65535"

    - sourceColumnName: "cell_id"
      targetColumnName: "CELL_ID"
      expectedType: INTEGER
      nullable: true
      transformations: [TRIM]
      validation:
        range:
          min: "0"
          max: "268435455"

    - sourceColumnName: "alternative_id"
      targetColumnName: "ALTERNATIVE_ID"
      expectedType: STRING
      nullable: true
      transformations: [TRIM, UPPERCASE]
      validation:
        maxLength: 50

    # ==========================================================================
    # Grid coordinates  (BNG OSGB36 — long integer, 8 digits max)
    # ==========================================================================

    - sourceColumnName: "bng_easting_m"
      targetColumnName: "BNG_EASTING_M"
      expectedType: INTEGER
      nullable: true
      transformations: [TRIM]
      validation:
        range:
          min: "0"
          max: "99999999"
        maxLength: 8

    - sourceColumnName: "bng_northing_m"
      targetColumnName: "BNG_NORTHING_M"
      expectedType: INTEGER
      nullable: true
      transformations: [TRIM]
      validation:
        range:
          min: "-100000"
          max: "99999999"
        maxLength: 8

    # ==========================================================================
    # Antenna parameters
    # ==========================================================================

    - sourceColumnName: "bearing_deg"
      targetColumnName: "BEARING_DEG"
      expectedType: INTEGER
      nullable: true
      transformations: [TRIM]
      validation:
        range:
          min: "0"
          max: "360"
        maxLength: 3

    - sourceColumnName: "beam_width_deg"
      targetColumnName: "BEAM_WIDTH_DEG"
      expectedType: DECIMAL
      nullable: true
      transformations: [TRIM]
      validation:
        range:
          min: "0"
          max: "360.00"
        maxLength: 6

    - sourceColumnName: "erp_w"
      targetColumnName: "ERP_W"
      expectedType: DECIMAL
      nullable: true
      transformations: [TRIM]
      validation:
        range:
          min: "0"
          max: "999.99"
        maxLength: 6

    - sourceColumnName: "antenna_height_m"
      targetColumnName: "ANTENNA_HEIGHT_M"
      expectedType: DECIMAL
      nullable: true
      transformations: [TRIM]
      validation:
        range:
          min: "0"
          max: "999.99"

    - sourceColumnName: "probable_range_m"
      targetColumnName: "PROBABLE_RANGE_M"
      expectedType: INTEGER
      nullable: true
      transformations: [TRIM]
      validation:
        range:
          min: "0"
          max: "99999999"
        maxLength: 8

    # ==========================================================================
    # Cell generation and technology
    # ==========================================================================

    - sourceColumnName: "generation"
      targetColumnName: "GENERATION"
      expectedType: STRING
      nullable: false
      transformations: [TRIM, UPPERCASE]
      validation:
        allowedValues: ["2G", "3G", "4G", "5G"]
        maxLength: 25

    - sourceColumnName: "technology"
      targetColumnName: "TECHNOLOGY"
      expectedType: STRING
      nullable: true
      transformations: [TRIM, UPPERCASE]
      validation:
        allowedValues: ["GSM", "UMTS", "LTE", "NR", "CDMA", "WCDMA"]
        maxLength: 50

    - sourceColumnName: "switch"
      targetColumnName: "SWITCH"
      expectedType: STRING
      nullable: true
      transformations: [TRIM, UPPERCASE]
      validation:
        maxLength: 50

    - sourceColumnName: "controller"
      targetColumnName: "CONTROLLER"
      expectedType: STRING
      nullable: true
      transformations: [TRIM, UPPERCASE]
      validation:
        maxLength: 25

    # ==========================================================================
    # 3G / UMTS parameters
    # ==========================================================================

    - sourceColumnName: "3g_sac"
      targetColumnName: "SAC"
      expectedType: INTEGER
      nullable: true
      transformations: [TRIM]
      validation:
        range:
          min: "0"
          max: "99999"
        maxLength: 5

    - sourceColumnName: "3g_rac"
      targetColumnName: "RAC"
      expectedType: INTEGER
      nullable: true
      transformations: [TRIM]
      validation:
        range:
          min: "0"
          max: "255"
        maxLength: 3

    - sourceColumnName: "3g_scram"
      targetColumnName: "SCRAM"
      expectedType: INTEGER
      nullable: true
      transformations: [TRIM]
      validation:
        range:
          min: "0"
          max: "511"
        maxLength: 3

    # ==========================================================================
    # 2G / GSM parameters
    # ==========================================================================

    - sourceColumnName: "2g_ncc"
      targetColumnName: "NCC"
      expectedType: INTEGER
      nullable: true
      transformations: [TRIM]
      validation:
        range:
          min: "0"
          max: "7"
        maxLength: 1

    - sourceColumnName: "2g_bcc"
      targetColumnName: "BCC"
      expectedType: INTEGER
      nullable: true
      transformations: [TRIM]
      validation:
        range:
          min: "0"
          max: "7"
        maxLength: 1

    - sourceColumnName: "2g_bcch"
      targetColumnName: "BCCH"
      expectedType: INTEGER
      nullable: true
      transformations: [TRIM]
      validation:
        range:
          min: "0"
          max: "1023"
        maxLength: 4

    # ==========================================================================
    # Site information
    # ==========================================================================

    - sourceColumnName: "site_code"
      targetColumnName: "SITE_CODE"
      expectedType: STRING
      nullable: false
      transformations: [TRIM, UPPERCASE]
      validation:
        minLength: 1
        maxLength: 10

    - sourceColumnName: "site_name"
      targetColumnName: "SITE_NAME"
      expectedType: STRING
      nullable: true
      transformations: [TRIM, REMOVE_NON_PRINTABLE]
      validation:
        maxLength: 150

    - sourceColumnName: "site_address"
      targetColumnName: "SITE_ADDRESS"
      expectedType: STRING
      nullable: true
      transformations: [TRIM, REMOVE_NON_PRINTABLE]
      validation:
        maxLength: 250

    - sourceColumnName: "site_postcode"
      targetColumnName: "SITE_POSTCODE"
      expectedType: STRING
      nullable: true
      transformations: [TRIM, UPPERCASE, REMOVE_SPACES]
      validation:
        pattern: "[A-Z]{1,2}[0-9][0-9A-Z]?[0-9][A-Z]{2}"
        maxLength: 10

    - sourceColumnName: "sector_code"
      targetColumnName: "SECTOR_CODE"
      expectedType: STRING
      nullable: false
      transformations: [TRIM, UPPERCASE]
      validation:
        minLength: 1
        maxLength: 5

    # ==========================================================================
    # Unified output fields — formula selects 4G or 5G source based on generation
    # ==========================================================================

    # ENODEB_ID: 4G=enodeb_id (eNB), 5G=gnodeb_id (gNB)
    - targetColumnName: "ENODEB_ID"
      inputFields:
        - name: "enodeb_id"
        - name: "gnodeb_id"
        - name: "generation"
      formula: calculateNodebId
      expectedType: INTEGER
      nullable: true

    # TAC: 4G=4g_tac (0-65535), 5G=5g_tac (0-16777215)
    - targetColumnName: "TAC"
      inputFields:
        - name: "4g_tac"
        - name: "5g_tac"
        - name: "generation"
      formula: calculateTac
      expectedType: INTEGER
      nullable: true

    # ENB_IP_ADDRESS: 4G eNB IP (pass-through; empty for 5G cells)
    - sourceColumnName: "4g_enb_ip_address"
      targetColumnName: "ENB_IP_ADDRESS"
      expectedType: STRING
      nullable: true
      transformations: [TRIM]
      validation:
        pattern: "((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)"
        maxLength: 15

    # MME_ID: 4G only
    - sourceColumnName: "4g_mme_id"
      targetColumnName: "MME_ID"
      expectedType: INTEGER
      nullable: true
      transformations: [TRIM]
      validation:
        range:
          min: "0"
          max: "16777215"
        maxLength: 8

    # PCI: 4G=4g_pci (0-503), 5G=5g_pci (0-1007)
    - targetColumnName: "PCI"
      inputFields:
        - name: "4g_pci"
        - name: "5g_pci"
        - name: "generation"
      formula: calculatePci
      expectedType: INTEGER
      nullable: true

    # CB_MHZ: 4G=4g_cb_mhz, 5G=5g_cb_mhz
    - targetColumnName: "CB_MHZ"
      inputFields:
        - name: "4g_cb_mhz"
        - name: "5g_cb_mhz"
        - name: "generation"
      formula: calculateCbMhz
      expectedType: DECIMAL
      nullable: true
      validation:
        allowedValues: ["1.4", "3", "5", "10", "15", "20", "25", "30", "40", "50", "60", "80", "100", "200", "400"]

    # DERIVED_ECI:
    #   4G LTE: eNB_ID × 256 + (cell_id & 0xFF)         [3GPP TS 36.413]
    #   5G NR:  gNB_ID × 2^(36 − gNB_ID_length) + cell_id  [3GPP TS 38.413]
    # gnodeb_id_lenth (source typo preserved) read from row context by formula.
    - targetColumnName: "DERIVED_ECI"
      inputFields:
        - name: "enodeb_id"
        - name: "gnodeb_id"
        - name: "cell_id"
        - name: "generation"
      formula: deriveEci
      expectedType: INTEGER
      nullable: true

    # GNB_IP_ADDRESS: 5G gNB IP (pass-through; empty for 4G cells)
    - sourceColumnName: "5g_gnb_ip_address"
      targetColumnName: "GNB_IP_ADDRESS"
      expectedType: STRING
      nullable: true
      transformations: [TRIM]
      validation:
        maxLength: 45

    # ==========================================================================
    # Derived coordinates — BNG (OSGB36) easting+northing → WGS84
    # bng_easting_m and bng_northing_m are read from row context by the formula.
    # ==========================================================================

    - targetColumnName: "DERIVE_LATITUDE"
      inputFields:
        - name: "bng_easting_m"
        - name: "bng_northing_m"
      formula: deriveLatitude
      expectedType: DECIMAL
      nullable: true

    - targetColumnName: "DERIVED_LONGITUDE"
      inputFields:
        - name: "bng_easting_m"
        - name: "bng_northing_m"
      formula: deriveLongitude
      expectedType: DECIMAL
      nullable: true
