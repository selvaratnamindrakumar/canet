# =============================================================================
# SMB -> CSV Processor — application configuration
# Override any value with environment variables (Spring convention):
#   SMB_HOST=myserver  or  --smb.host=myserver
# =============================================================================

spring.application.name=smb-csv-processor

# Disable embedded web server — this is a batch/daemon application
spring.main.web-application-type=none

# =============================================================================
# SMB source share
# =============================================================================
smb.host=smb-server.example.com
smb.port=445
smb.domain=
smb.username=svc_reader
smb.password=change_me

smb.share-name=shared
smb.remote-directory=/uploads/daily
smb.file-pattern=*.zip
smb.polling-interval-ms=300000

# Valid jcifs-ng DialectVersion enum values: SMB1 | SMB202 | SMB210 | SMB300 | SMB302 | SMB311
smb.min-smb-version=SMB202
smb.max-smb-version=SMB311
smb.connect-timeout-ms=30000
smb.response-timeout-ms=60000

# =============================================================================
# SFTP destination
# =============================================================================
sftp.host=sftp-server.example.com
sftp.port=22
sftp.username=svc_uploader
sftp.private-key-path=/opt/app/.ssh/id_rsa
sftp.private-key-passphrase=
# sftp.password=change_me
sftp.known-hosts-file=/opt/app/.ssh/known_hosts
sftp.remote-directory=/inbound/processed
sftp.connect-timeout-ms=30000

# =============================================================================
# Local processing directories
# All directories are created automatically at startup.
# =============================================================================
processing.directories.input-zip=/data/processor/input/zip
processing.directories.input-csv=/data/processor/input/csv
processing.directories.output-success=/data/processor/output/success
processing.directories.output-quarantine=/data/processor/output/quarantine
processing.directories.output-archive=/data/processor/output/archive

# =============================================================================
# Test mode — set enabled=true to bypass SMB + SFTP (no live servers needed)
# Drop .csv or .zip files into drop-directory to inject into the pipeline.
# =============================================================================
processing.test-mode.enabled=false
processing.test-mode.drop-directory=/data/processor/test-drop

# =============================================================================
# Apache Camel
# =============================================================================
camel.springboot.name=smb-csv-processor-camel
camel.springboot.main-run-controller=true
camel.springboot.shutdown-timeout=300

# =============================================================================
# Logging
# Full appender / rolling config is in logback-spring.xml
# =============================================================================
logging.level.root=INFO
logging.level.com.example.csvprocessor=DEBUG
logging.level.org.apache.camel=INFO
logging.level.jcifs=WARN
