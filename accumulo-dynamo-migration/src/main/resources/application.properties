spring.application.name=accumulo-dynamo-migration
server.port=8080

# AWS region — override with AWS_REGION env var or -Daws.region=
aws.region=us-east-1

# DynamoDB table name
aws.dynamodb.table-name=accumulo-migration

# Set to true + provide endpoint to use DynamoDB Local (see application-local.properties)
aws.dynamodb.local=false
aws.dynamodb.endpoint=

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
