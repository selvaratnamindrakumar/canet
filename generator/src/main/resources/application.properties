# Generator does not expose HTTP endpoints — disable the embedded web server
spring.main.web-application-type=none

# ─── Thread pool ─────────────────────────────────────────────────────
num.threads=8
queue.size=5000

# ─── Network capture ─────────────────────────────────────────────────
# Name or IP of the capture interface (e.g. eth0).
# Leave blank to auto-select the first non-loopback interface.
network.interface=

# ─── Validator endpoint ──────────────────────────────────────────────
# Base URL of the running validator service.
validator.base-url=http://localhost:8080

# ─── Outbound SSL (generator → validator over HTTPS) ─────────────────
# Set these when the validator is configured for HTTPS.
# Leave blank for plain HTTP.
#ssl.keystore.path=/etc/canet/keystore.p12
#ssl.keystore.password=changeit
#ssl.keystore.type=PKCS12
#ssl.truststore.path=/etc/canet/truststore.p12
#ssl.truststore.password=changeit
#ssl.truststore.type=PKCS12

# ─── Logging ─────────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.canet.generator=INFO
