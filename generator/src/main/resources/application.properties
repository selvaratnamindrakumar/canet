# Generator does not expose HTTP endpoints — disable the embedded web server
spring.main.web-application-type=none

# ─── Thread pool ─────────────────────────────────────────────────────
num.threads=8
queue.size=5000

# ─── Network capture ─────────────────────────────────────────────────
# Name or IP of the capture interface (e.g. eth0, eth1).
# Leave blank to auto-select the first non-loopback interface.
network.interface=

# ─── Validator endpoint ──────────────────────────────────────────────
validator.base-url=http://localhost:8080

# ─── Outbound SSL (generator → validator over HTTPS) ─────────────────
#ssl.keystore.path=C:/canet/generator/config/keystore.p12
#ssl.keystore.password=changeit
#ssl.keystore.type=PKCS12
#ssl.truststore.path=C:/canet/generator/config/truststore.p12
#ssl.truststore.password=changeit
#ssl.truststore.type=PKCS12

# ─── Log file location ───────────────────────────────────────────────
# Relative to the working directory set in NSSM (AppDirectory).
# When deployed as a Windows service with AppDirectory=C:\canet\generator,
# logs will be written to C:\canet\generator\logs\canet-generator.log
logging.file.name=logs/canet-generator.log

# ─── Rolling policy ──────────────────────────────────────────────────
# Roll by date and size.  Files are compressed (.gz) on rotation.
# %d{yyyy-MM-dd} — one archive per day
# %i             — index within the day when max-file-size is exceeded
logging.logback.rollingpolicy.file-name-pattern=logs/canet-generator.%d{yyyy-MM-dd}.%i.log.gz

# Maximum size of the active log file before rotation triggers
logging.logback.rollingpolicy.max-file-size=20MB

# Number of days of archived logs to retain
logging.logback.rollingpolicy.max-history=30

# Hard cap across all archived logs regardless of max-history
logging.logback.rollingpolicy.total-size-cap=2GB

# Delete old archives at startup if cap is already exceeded
logging.logback.rollingpolicy.clean-history-on-start=false

# ─── Log format ──────────────────────────────────────────────────────
# Include thread name — useful for identifying pcap-capture-thread vs pool workers
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %-40.40logger{39} : %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %-40.40logger{39} : %msg%n

# ─── Log levels ──────────────────────────────────────────────────────
# root=WARN suppresses framework noise; raise to INFO only for debugging
logging.level.root=WARN
logging.level.com.canet.generator=INFO
logging.level.org.springframework=WARN
logging.level.org.pcap4j=WARN

# Uncomment for verbose Spring and Hibernate output during development:
#logging.level.root=INFO
#logging.level.org.springframework.web=DEBUG
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
