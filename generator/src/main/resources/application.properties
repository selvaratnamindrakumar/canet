# Generator does not expose HTTP endpoints — disable the embedded web server
spring.main.web-application-type=none

# ─── Thread pool ─────────────────────────────────────────────────────
num.threads=8
queue.size=5000

# ─── Network capture ─────────────────────────────────────────────────
# Pcap device name of the interface to monitor.
#
# Leave BLANK on first run — the generator will log every available
# interface with its index, pcap name, description, and IP addresses,
# then exit cleanly so you can identify the correct one.
#
# Once you have the name, set it here and restart the service.
# Only ONE interface is monitored at a time.
#
# Windows (escape each backslash with another backslash):
#   network.interface.name=\\Device\\NPF_{XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX}
#
# Linux / macOS:
#   network.interface.name=eth0
#   network.interface.name=en0
#
# Alternatively, specify the IP address bound to the interface:
#   network.interface.name=192.168.1.10
#
network.interface.name=

# ─── Payload encoding ────────────────────────────────────────────────
# The raw UDP payload is always included in the registration request as a
# hex string (payloadHex).
#
# Set enable.base64.payload=true to additionally include a Base64-encoded
# copy of the same bytes (payloadBase64) in the request body.
# Useful when the receiving system expects Base64-encoded binary data.
enable.base64.payload=false

# ─── Validator endpoint ──────────────────────────────────────────────
#
# Option A — SSL disabled on validator (server.ssl.enabled=false, port 8080):
validator.base-url=http://localhost:8080
#
# Option B — SSL enabled on validator (server.ssl.enabled=true, port 8443):
# validator.base-url=https://localhost:8443
# validator.ssl.trust-all=true
#
# Endpoints called:  POST /create   (register hash)
#                    POST /racs     (check hash exists)

# ─── Diosma endpoint ─────────────────────────────────────────────────
# After the validator confirms storage (201), the generator posts the
# payload to Diosma so it can independently recalculate the hash and
# verify it with the validator.
# Leave blank to disable Diosma notification from the generator.
diosma.base-url=
diosma.notify-path=/api/diosma/receive

# Headers sent with every Diosma POST
diosma.headers.X-Application-Id=canet-generator
diosma.headers.X-Source=canet

# ─── Outbound SSL (generator → validator over HTTPS) ─────────────────
#ssl.keystore.path=C:/canet/generator/config/keystore.p12
#ssl.keystore.password=changeit
#ssl.keystore.type=PKCS12
#ssl.truststore.path=C:/canet/generator/config/truststore.p12
#ssl.truststore.password=changeit
#ssl.truststore.type=PKCS12

# ─── Log file location ───────────────────────────────────────────────
# Relative to the working directory set in NSSM (AppDirectory).
# When deployed as a Windows service with AppDirectory=C:\canet\generator,
# logs will be written to C:\canet\generator\logs\canet-generator.log
logging.file.name=logs/canet-generator.log

# ─── Rolling policy ──────────────────────────────────────────────────
# Roll by date and size.  Files are compressed (.gz) on rotation.
# %d{yyyy-MM-dd} — one archive per day
# %i             — index within the day when max-file-size is exceeded
logging.logback.rollingpolicy.file-name-pattern=logs/canet-generator.%d{yyyy-MM-dd}.%i.log.gz

# Maximum size of the active log file before rotation triggers
logging.logback.rollingpolicy.max-file-size=20MB

# Number of days of archived logs to retain
logging.logback.rollingpolicy.max-history=30

# Hard cap across all archived logs regardless of max-history
logging.logback.rollingpolicy.total-size-cap=2GB

# Delete old archives at startup if cap is already exceeded
logging.logback.rollingpolicy.clean-history-on-start=false

# ─── Log format ──────────────────────────────────────────────────────
# Include thread name — useful for identifying pcap-capture-thread vs pool workers
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %-40.40logger{39} : %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %-40.40logger{39} : %msg%n

# ─── Log levels ──────────────────────────────────────────────────────
# root=WARN suppresses framework noise; raise to INFO only for debugging
logging.level.root=WARN
logging.level.com.canet.generator=INFO
logging.level.org.springframework=WARN
logging.level.org.pcap4j=WARN

# Uncomment for verbose Spring and Hibernate output during development:
#logging.level.root=INFO
#logging.level.org.springframework.web=DEBUG
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
