spring:
  application:
    name: canet-app
  thymeleaf:
    cache: false

server:
  port: 8080

# Endpoint definitions — each entry links a URL to a field mapping.
# compact-fields: columns shown in the table row.
# detail-fields:  columns shown in the expandable panel; use ["*"] for all remaining fields.
# labels:         human-readable column header overrides (key = JSON field name).
canet:
  endpoints:
    - name: todos
      url: https://jsonplaceholder.typicode.com/todos
      default-endpoint: true
      compact-fields:
        - userId
        - id
        - title
      detail-fields:
        - "*"
      labels:
        userId: "User ID"
        id: "ID"
        title: "Title"
        completed: "Completed"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.canet: DEBUG

---
# ── dev profile ───────────────────────────────────────────────────────────────
# Points the main app at the local mock-server instead of the live API.
# Usage:
#   1. cd mock-server && mvn spring-boot:run      (starts on port 8081)
#   2. cd spring-boot-app && mvn spring-boot:run -Dspring-boot.run.profiles=dev
spring:
  config:
    activate:
      on-profile: dev

canet:
  endpoints:
    - name: handset-search
      url: http://localhost:8081/handsetdetails
      default-endpoint: true
      compact-fields:
        - tac
        - marketingName
        - manufacturer
        - modelName
        - operatingSystem
      detail-fields:
        - "*"
      labels:
        tac: "TAC"
        marketingName: "Marketing Name"
        manufacturer: "Manufacturer"
        modelName: "Model Name"
        operatingSystem: "Operating System"
        osVersion: "OS Version"
        networkGenerations: "Network Generations"
        displaySizeInches: "Display (inches)"
        releaseYear: "Release Year"
        nfcSupported: "NFC Supported"
        wirelessChargingSupported: "Wireless Charging"
