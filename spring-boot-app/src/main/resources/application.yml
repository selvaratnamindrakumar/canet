spring:
  application:
    name: canet-app
  thymeleaf:
    cache: false

server:
  port: 8080

# External HTTPS API target — swap this URL for any JSON endpoint.
# The UI, controller and service are fully generic: column headers and cell
# values are derived from whatever field names the JSON response contains.
#
# Examples:
#   Todos (default):  https://jsonplaceholder.typicode.com/todos
#   Handset details:  https://api.example.com/handsets          (fields: tac, marketingName, manufacturer, …)
#   Local mock:       start mock-server then run with --spring.profiles.active=dev
external:
  api:
    base-url: https://jsonplaceholder.typicode.com/todos

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.canet: DEBUG

---
# ── dev profile ───────────────────────────────────────────────────────────────
# Points the main app at the local mock-server instead of the live API.
# Usage:
#   1. cd mock-server && mvn spring-boot:run      (starts on port 8081)
#   2. cd spring-boot-app && mvn spring-boot:run -Dspring-boot.run.profiles=dev
spring:
  config:
    activate:
      on-profile: dev

external:
  api:
    base-url: http://localhost:8081/handsetdetails
