spring:
  application:
    name: canet-app
  thymeleaf:
    cache: false

server:
  port: 8080

# Endpoint definitions.
# Each entry links a search type ("handset" or "cell") to a URL, field mapping,
# display labels, JSON-flattening config, submit delay, and validation rules.
# compact-fields: shown in the table row.
# detail-fields:  shown in the expandable panel; ["*"] means all remaining fields.
# flatten:        flatten nested JSON objects (e.g. b:{c:2} → b-c:2).
# submit-delay-seconds: seconds the submit button stays disabled on page load.
# validation-pattern:   client-side regex for each entry (empty = no validation).
# max-entries:    HANDSET_SEARCH_CONFIG / CELL_SEARCH_CONFIG — upper limit on
#                 entries accepted per search (default 20, reduce to restrict).
canet:
  endpoints:
    - name: todos
      type: handset
      url: https://jsonplaceholder.typicode.com/todos
      default-endpoint: true
      compact-fields:
        - inputValue
        - userId
        - id
        - title
      detail-fields:
        - "*"
      labels:
        inputValue: "Searched Value"
        userId: "User ID"
        id: "ID"
        title: "Title"
        completed: "Completed"
      flatten: false
      flatten-separator: "-"
      submit-delay-seconds: 0
      validation-pattern: ""
      validation-message: ""
      max-entries: 20          # HANDSET_SEARCH_CONFIG
    - name: todos-cell
      type: cell
      url: https://jsonplaceholder.typicode.com/todos
      default-endpoint: false
      compact-fields:
        - inputValue
        - userId
        - id
        - title
      detail-fields:
        - "*"
      labels:
        inputValue: "Searched Value"
        userId: "User ID"
        id: "ID"
        title: "Title"
        completed: "Completed"
      flatten: false
      flatten-separator: "-"
      submit-delay-seconds: 0
      validation-pattern: ""
      validation-message: ""
      max-entries: 20          # CELL_SEARCH_CONFIG

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.canet: DEBUG

---
# ── dev profile ───────────────────────────────────────────────────────────────
# Points the main app at the local mock-server instead of the live API.
# Usage:
#   1. cd mock-server && mvn spring-boot:run      (starts on port 8081)
#   2. cd spring-boot-app && mvn spring-boot:run -Dspring-boot.run.profiles=dev
spring:
  config:
    activate:
      on-profile: dev

canet:
  endpoints:
    - name: handset-search
      type: handset
      url: http://localhost:8081/handsetdetails
      default-endpoint: true
      compact-fields:
        - inputValue
        - tac
        - marketingName
        - manufacturer
        - modelName
        - operatingSystem
      detail-fields:
        - "*"
      labels:
        inputValue: "Searched Value"
        tac: "TAC"
        marketingName: "Marketing Name"
        manufacturer: "Manufacturer"
        modelName: "Model Name"
        operatingSystem: "Operating System"
        osVersion: "OS Version"
        network-generations: "Network Generations"
        network-type: "Network Type"
        displaySizeInches: "Display (inches)"
        releaseYear: "Release Year"
        capabilities-nfc: "NFC Supported"
        capabilities-wirelessCharging: "Wireless Charging"
      flatten: true
      flatten-separator: "-"
      submit-delay-seconds: 3
      validation-pattern: "^\\d{8}$"
      validation-message: "Must be exactly 8 digits"
      max-entries: 20          # HANDSET_SEARCH_CONFIG
    - name: cell-search
      type: cell
      url: http://localhost:8081/handsetdetails
      default-endpoint: false
      compact-fields:
        - inputValue
        - tac
        - marketingName
        - manufacturer
        - modelName
      detail-fields:
        - "*"
      labels:
        inputValue: "Searched Value"
        tac: "TAC"
        marketingName: "Marketing Name"
        manufacturer: "Manufacturer"
        modelName: "Model Name"
        operatingSystem: "Operating System"
        osVersion: "OS Version"
        network-generations: "Network Generations"
        network-type: "Network Type"
        displaySizeInches: "Display (inches)"
        releaseYear: "Release Year"
        capabilities-nfc: "NFC Supported"
        capabilities-wirelessCharging: "Wireless Charging"
      flatten: true
      flatten-separator: "-"
      submit-delay-seconds: 3
      validation-pattern: "^\\d{15}$"
      validation-message: "Must be exactly 15 digits"
      max-entries: 20          # CELL_SEARCH_CONFIG
