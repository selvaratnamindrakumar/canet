<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>CaNet — HTTPS Data Viewer</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand fw-bold">CaNet Data Viewer</span>
        <div class="d-flex gap-3 align-items-center">
            <a href="/" class="nav-link text-white active">Data</a>
            <a href="/about" class="nav-link text-white-50">Why Spring Boot?</a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <!-- Summary bar -->
    <div class="row g-3 mb-4">
        <div class="col-sm-6 col-md-3">
            <div class="card text-bg-primary">
                <div class="card-body">
                    <div class="card-title small">Total Records</div>
                    <div class="display-6 fw-bold" th:text="${totalCount}">0</div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-md-3">
            <div class="card text-bg-secondary">
                <div class="card-body">
                    <div class="card-title small">Columns</div>
                    <div class="display-6 fw-bold" th:text="${#lists.size(columns)}">0</div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-md-3">
            <div class="card text-bg-dark">
                <div class="card-body">
                    <div class="card-title small">REST Endpoint</div>
                    <a href="/api/data" class="btn btn-sm btn-light mt-1" target="_blank">View JSON</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Filter bar: searches across all cell values -->
    <div class="mb-3 d-flex gap-2 align-items-center flex-wrap">
        <input id="filterInput" type="text" class="form-control w-auto flex-grow-1"
               placeholder="Filter across all columns…" oninput="filterTable()"/>
        <span class="text-muted small" id="matchCount"></span>
    </div>

    <!-- Empty state -->
    <div th:if="${#lists.isEmpty(rows)}" class="alert alert-warning">
        No data returned from the external API. Check the configured URL and logs for errors.
    </div>

    <!-- Dynamic table — columns and rows come entirely from the JSON response -->
    <div th:unless="${#lists.isEmpty(rows)}" class="table-responsive">
        <table class="table table-striped table-hover align-middle" id="dataTable">
            <thead class="table-dark">
                <tr>
                    <th th:each="col : ${columns}" th:text="${col}"></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="row : ${rows}">
                    <td th:each="col : ${columns}" th:text="${row.get(col)}"></td>
                </tr>
            </tbody>
        </table>
    </div>

    <p class="text-muted small mt-3">
        Data sourced via HTTPS · <a href="/api/data" target="_blank">/api/data</a>
    </p>
</div>

<script>
function filterTable() {
    const term = document.getElementById('filterInput').value.toLowerCase();
    const rows = document.querySelectorAll('#dataTable tbody tr');
    let visible = 0;
    rows.forEach(row => {
        const match = !term || [...row.cells].some(td => td.textContent.toLowerCase().includes(term));
        row.style.display = match ? '' : 'none';
        if (match) visible++;
    });
    const total = rows.length;
    document.getElementById('matchCount').textContent =
        term ? `${visible} of ${total} shown` : '';
}
</script>

</body>
</html>
