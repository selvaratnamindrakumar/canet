spring:
  application:
    name: canet-app
  thymeleaf:
    cache: false

server:
  port: 8080

# External HTTPS API target — swap this URL for any JSON endpoint.
# The UI, controller and service are fully generic: column headers and cell
# values are derived from whatever field names the JSON response contains.
#
# Examples:
#   Todos (default):  https://jsonplaceholder.typicode.com/todos
#   Handset details:  https://api.example.com/handsets          (fields: tac, marketingName, manufacturer, modelName, …)
#   Any REST API:     https://your-api.example.com/resources
external:
  api:
    base-url: https://jsonplaceholder.typicode.com/todos

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.canet: DEBUG
