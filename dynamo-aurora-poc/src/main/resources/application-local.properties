# Local dev: DynamoDB Local + PostgreSQL in Docker
spring.profiles.active=local

# DynamoDB Local
aws.dynamodb.local=true
aws.dynamodb.endpoint=http://localhost:8000
aws.region=us-east-1

# Local PostgreSQL (from docker-compose)
spring.datasource.url=jdbc:postgresql://localhost:5432/pocdb
spring.datasource.username=poc
spring.datasource.password=poc
spring.jpa.hibernate.ddl-auto=validate
