# AWS Sandbox deployment
# Set these via environment variables or AWS Secrets Manager

# DynamoDB (real AWS)
aws.dynamodb.local=false
aws.region=${AWS_REGION:us-east-1}

# Aurora PostgreSQL Serverless v2
# Replace with your Aurora cluster endpoint
spring.datasource.url=jdbc:postgresql://${AURORA_ENDPOINT:localhost}:5432/pocdb
spring.datasource.username=${AURORA_USER:poc}
spring.datasource.password=${AURORA_PASSWORD:poc}
spring.jpa.hibernate.ddl-auto=validate

# Connection pool tuning for Aurora
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
