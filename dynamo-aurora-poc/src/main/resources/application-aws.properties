# AWS Sandbox profile — connects to real DynamoDB + Aurora PostgreSQL (+ optionally RDS Oracle)
# Activate with: --spring.profiles.active=aws
# Add Oracle:    --spring.profiles.active=aws,oracle

# ── AWS / DynamoDB ─────────────────────────────────────────────────────────────
aws.dynamodb.local=false
aws.region=${AWS_REGION:us-east-1}
poc.dynamo.table-name=handset-reference

# ── Aurora PostgreSQL ──────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${AURORA_ENDPOINT:localhost}:5432/pocdb
spring.datasource.username=${AURORA_USER:poc}
spring.datasource.password=${AURORA_PASSWORD:poc}
spring.jpa.hibernate.ddl-auto=validate

# Connection pool (Aurora keeps connections warm)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# Flyway (Aurora)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── Oracle (only when oracle profile also active) ──────────────────────────────
# ORACLE_ENDPOINT, ORACLE_USER, ORACLE_PASSWORD set as Elastic Beanstalk env vars
