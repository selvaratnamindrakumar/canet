# Profile to activate Oracle as a third backend alongside DynamoDB + Aurora.
# Add this to your active profiles: --spring.profiles.active=aws,oracle
# Or locally with RDS Oracle endpoint:  --spring.profiles.active=local,oracle

oracle.enabled=true

# RDS Oracle SE2 connection
# Replace ${ORACLE_ENDPOINT} with your RDS endpoint
spring.datasource.oracle.url=jdbc:oracle:thin:@//${ORACLE_ENDPOINT:localhost}:1521/${ORACLE_SERVICE:ORCL}
spring.datasource.oracle.username=${ORACLE_USER:poc}
spring.datasource.oracle.password=${ORACLE_PASSWORD:poc}
spring.datasource.oracle.driver-class-name=oracle.jdbc.OracleDriver

# Hibernate — separate JPA context for Oracle
spring.jpa.oracle.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.oracle.hibernate.ddl-auto=validate

# Flyway for Oracle — separate migration path
spring.flyway.oracle.enabled=true
spring.flyway.oracle.url=${spring.datasource.oracle.url}
spring.flyway.oracle.user=${spring.datasource.oracle.username}
spring.flyway.oracle.password=${spring.datasource.oracle.password}
spring.flyway.oracle.locations=classpath:db/migration-oracle
