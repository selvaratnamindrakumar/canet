spring.application.name=dynamo-aurora-poc
server.port=8080

# ── AWS / DynamoDB ─────────────────────────────────────────────────────────────
aws.region=us-east-1
aws.dynamodb.local=false
aws.dynamodb.endpoint=
poc.dynamo.table-name=handset-reference

# ── Aurora PostgreSQL ──────────────────────────────────────────────────────────
# Override these with your Aurora endpoint in application-aws.properties
spring.datasource.url=jdbc:postgresql://localhost:5432/pocdb
spring.datasource.username=poc
spring.datasource.password=poc
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── Actuator ───────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
