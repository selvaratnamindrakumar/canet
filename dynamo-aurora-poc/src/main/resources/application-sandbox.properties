# ─────────────────────────────────────────────────────────────────────────────
# Sandbox profile — your real AWS environment (eu-west-2, cgi-sandbox account)
#
# PowerShell startup:
#   $env:AWS_PROFILE="cgi-sandbox"
#   $env:AWS_REGION="eu-west-2"
#   $env:AURORA_PASSWORD="PocUser123!"
#   mvn spring-boot:run -Dspring-boot.run.profiles=sandbox
#
# Or with IAM token (expires 15 min — use poc_user for long runs):
#   $token = aws rds generate-db-auth-token --hostname database-1.cluster-cpyvdizxeqif.eu-west-2.rds.amazonaws.com --port 5432 --username postgres --region eu-west-2
#   $env:AURORA_USER="postgres"
#   $env:AURORA_PASSWORD=$token
#   mvn spring-boot:run -Dspring-boot.run.profiles=sandbox
# ─────────────────────────────────────────────────────────────────────────────

# ── AWS / DynamoDB ─────────────────────────────────────────────────────────────
aws.dynamodb.local=false
aws.region=${AWS_REGION:eu-west-2}
poc.dynamo.table-name=${DYNAMO_TABLE:HandsetReference}

# ── Aurora PostgreSQL (your sandbox cluster) ────────────────────────────────
# Database: migrationpoc (already exists with migration_entry table)
# User options:
#   poc_user  — password auth (preferred, fix PAM issue first, see README)
#   postgres  — IAM token auth (short-lived 15-min token, test only)
spring.datasource.url=jdbc:postgresql://${AURORA_ENDPOINT:database-1.cluster-cpyvdizxeqif.eu-west-2.rds.amazonaws.com}:5432/${AURORA_DB:migrationpoc}?sslmode=require
spring.datasource.username=${AURORA_USER:poc_user}
spring.datasource.password=${AURORA_PASSWORD}

# DDL — let Flyway manage schema creation (creates handset_reference table)
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Connection pool tuned for sandbox (single dev, low concurrency)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.keepalive-time=60000

# ── PAM auth fix reminder ────────────────────────────────────────────────────
# If you see "PAM authentication failed for user poc_user", connect as postgres
# using an IAM token and run these SQL commands once:
#
#   REVOKE rds_iam FROM poc_user;   -- removes IAM-only flag if set
#   ALTER ROLE poc_user WITH LOGIN PASSWORD 'PocUser123!';
#   GRANT CONNECT ON DATABASE migrationpoc TO poc_user;
#   GRANT USAGE ON SCHEMA public TO poc_user;
#   GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO poc_user;
#   ALTER DEFAULT PRIVILEGES IN SCHEMA public
#     GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO poc_user;
