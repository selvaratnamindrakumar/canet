# ============================================================
# docker-compose.yml — Local development environment
#
# Simulates the AWS architecture locally:
#   app      → Spring Boot application (mimics ECS task)
#   localstack → AWS service emulation (S3, SQS, DynamoDB)
#   prometheus → Metrics scraping (mimics CloudWatch)
#   grafana    → Metrics visualisation dashboard
#
# Start all services:  docker compose up --build
# App only:           docker compose up app
# ============================================================

version: "3.9"

services:

  # ── Spring Boot Application ─────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: cloud-readiness-demo:local
    container_name: cloud-readiness-app
    ports:
      - "8080:8080"
    environment:
      # Simulates ECS task-definition environment block
      SPRING_PROFILES_ACTIVE: local
      APP_ENVIRONMENT: local-docker
      APP_VERSION: "1.0.0-SNAPSHOT"
      AWS_DEFAULT_REGION: us-east-1
      SERVER_PORT: "8080"
      JAVA_OPTS: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -Djava.security.egd=file:/dev/./urandom
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - backend
    depends_on:
      localstack:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Mirrors typical ECS Fargate task size (0.5 vCPU / 1 GB)
          cpus: "0.5"
          memory: "1g"

  # ── LocalStack (AWS service emulation) ──────────────────────
  localstack:
    image: localstack/localstack:3.5
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,sqs,dynamodb,ssm,secretsmanager
      DEBUG: "0"
      DATA_DIR: /var/lib/localstack
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

  # ── Prometheus (metrics collection) ─────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    networks:
      - backend
    depends_on:
      - app

  # ── Grafana (metrics dashboard) ─────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - backend
    depends_on:
      - prometheus

volumes:
  localstack-data:
  prometheus-data:
  grafana-data:

networks:
  backend:
    driver: bridge
