# ============================================================
# application.yml — Base configuration (all profiles)
#
# Cloud Readiness Pattern: Factor III — Config
# All sensitive or environment-specific values are overridden
# via environment variables (12-Factor) or AWS SSM / Secrets
# Manager at runtime.  This file holds safe defaults only.
# ============================================================

spring:
  application:
    name: cloud-readiness-demo
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

server:
  port: ${SERVER_PORT:8080}
  # Graceful shutdown — in-flight requests drain before the
  # container exits (Cloud Readiness: Factor IX — Disposability)
  shutdown: graceful

spring.lifecycle:
  timeout-per-shutdown-phase: 30s

# ── Actuator / Observability ──────────────────────────────────
# Expose all endpoints for demo; in production restrict to
# internal-only network paths or use an ALB rule.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: always          # exposes custom health indicator details
      probes:
        enabled: true               # /actuator/health/liveness & /readiness
    info:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
  # Prometheus metrics — scraped by CloudWatch Container Insights
  # or a Prometheus server in EKS
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: ${app.environment:local}

# ── Application custom properties ────────────────────────────
app:
  environment: ${APP_ENVIRONMENT:local}
  region:      ${AWS_DEFAULT_REGION:us-east-1}
  version:     ${APP_VERSION:1.0.0}

# ── Info endpoint metadata ────────────────────────────────────
info:
  app:
    name: ${spring.application.name}
    version: ${app.version}
    description: "Spring Boot Cloud Readiness PoC"
  cloud:
    provider: AWS
    services: "ECS Fargate, ECR, ALB, CloudWatch"
