spring.application.name=accumulo-key-poc
server.port=8080

aws.region=us-east-1
aws.dynamodb.local=false
aws.dynamodb.endpoint=
poc.dynamo.cells-table=handset-cells

spring.datasource.url=jdbc:postgresql://localhost:5432/keypocdb
spring.datasource.username=poc
spring.datasource.password=poc
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
