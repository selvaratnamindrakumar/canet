# ─── H2 profile — full JPA persistence with H2 in-memory (no MySQL needed) ──
# Activate: --spring.profiles.active=h2
# Use for: local dev, functional testing, demo, CI without a DB container.
# Data is lost on restart.

spring.datasource.url=jdbc:h2:mem:canet;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# H2 web console — browse to http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:mem:canet  User: sa  Password: (blank)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Disable SSL so the console is reachable on plain HTTP (port 8080)
server.ssl.enabled=false
server.port=8080

# Disable Diosma notifications (no middle tier in H2 test mode)
diosma.post-url=
