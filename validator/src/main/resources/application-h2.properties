# ─── H2 profile — full JPA persistence with H2 in-memory (no MySQL needed) ──
# Activate: --spring.profiles.active=h2
# Use for: local dev, functional testing, demo, CI without a DB container.
# Data is lost on restart.

# ── Override MySQL datasource entirely ───────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:canet;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── Hikari pool — small, in-memory only ──────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=300000

# ── Override MySQL JPA dialect ────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ── H2 web console — http://localhost:8080/h2-console ────────────────────────
# JDBC URL: jdbc:h2:mem:canet   User: sa   Password: (blank)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── SSL off so the console and health check are reachable on plain HTTP ───────
server.ssl.enabled=false
server.port=8080

# ── No Diosma in H2 test mode ────────────────────────────────────────────────
diosma.post-url=
