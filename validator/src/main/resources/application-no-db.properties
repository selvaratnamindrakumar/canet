# ─── No-DB profile — in-memory store only, no database writes anywhere ───────
# Activate: --spring.profiles.active=no-db
# Use for: secure / air-gapped environments where no database is available.
# Records are held in a ConcurrentHashMap for the lifetime of the process.
# Data is lost on restart.

# ── Feature flag: disable JPA persistence; use InMemoryDatabaseGateway ────────
validator.database.enabled=false

# ── H2 datasource satisfies Spring Boot JPA auto-configure (required) ─────────
# JPA beans are still created so the app starts; no actual writes reach H2
# because ValidatorController now calls DatabaseGateway, not the JPA repository.
spring.datasource.url=jdbc:h2:mem:canet_nodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none

# ── SSL off for no-db environments (no keystore needed) ───────────────────────
server.ssl.enabled=false
server.port=8080

# Disable Diosma notifications
diosma.post-url=
