# ─── No-DB profile — in-memory store only, no database writes anywhere ───────
# Activate: --spring.profiles.active=no-db
# Use for: secure / air-gapped environments where no database is available.
# Records are held in a ConcurrentHashMap for the lifetime of the process.
# Data is lost on restart.

# ── Feature flag: use InMemoryDatabaseGateway instead of JPA ─────────────────
validator.database.enabled=false

# ── H2 datasource — satisfies Spring Boot JPA autoconfigure (required) ────────
# JPA beans initialise but ValidatorController calls DatabaseGateway (in-memory),
# so no actual reads or writes reach H2.
spring.datasource.url=jdbc:h2:mem:canet_nodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── Hikari pool — minimal, no real workload hits the DB ──────────────────────
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=300000

# ── Override MySQL JPA dialect ────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# none: don't create or alter any tables — the in-memory gateway doesn't need them
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# ── SSL off for no-db environments (no keystore needed) ───────────────────────
server.ssl.enabled=false
server.port=8080

# ── No Diosma notifications ───────────────────────────────────────────────────
diosma.post-url=
