server.port=8080

# ─── Duplicate detection window ──────────────────────────────────────
# 60=1min  3600=1hr(default)  86400=24hr  604800=7days
dedup.window.seconds=3600

# ─── Database ────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/canet?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=canet
spring.datasource.password=canet
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=4
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=300000

# ─── JPA ─────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# ─── Server SSL (so Diosma can reach the validator over HTTPS) ────────
#server.ssl.enabled=true
#server.ssl.key-store=C:/canet/validator/config/keystore.p12
#server.ssl.key-store-password=changeit
#server.ssl.key-store-type=PKCS12
#server.ssl.trust-store=C:/canet/validator/config/truststore.p12
#server.ssl.trust-store-password=changeit
#server.ssl.client-auth=want

# ─── Log file location ───────────────────────────────────────────────
# Relative to NSSM AppDirectory (C:\canet\validator).
# Logs written to C:\canet\validator\logs\canet-validator.log
logging.file.name=logs/canet-validator.log

# ─── Rolling policy ──────────────────────────────────────────────────
logging.logback.rollingpolicy.file-name-pattern=logs/canet-validator.%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=20MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=2GB
logging.logback.rollingpolicy.clean-history-on-start=false

# ─── Log format ──────────────────────────────────────────────────────
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %-40.40logger{39} : %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %-40.40logger{39} : %msg%n

# ─── Log levels ──────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.canet.validator=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

# Show generated SQL (useful when verifying the time-window dedup query):
