server.port=8080

# ─── Duplicate detection window ──────────────────────────────────────
# Only messages whose received_at falls within the last N seconds are
# considered when checking for a duplicate hash.
# 60=1min  3600=1hr(default)  86400=24hr  604800=7days
dedup.window.seconds=3600

# ─── Database ────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/canet?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=canet
spring.datasource.password=canet
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=4
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=300000

# ─── JPA ─────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# ─── Server SSL (so Diosma can reach the validator over HTTPS) ────────
# Uncomment and supply certificate files to enable HTTPS.
# When enabled, update generator's validator.base-url to https://...
#server.ssl.enabled=true
#server.ssl.key-store=/etc/canet/keystore.p12
#server.ssl.key-store-password=changeit
#server.ssl.key-store-type=PKCS12
#server.ssl.trust-store=/etc/canet/truststore.p12
#server.ssl.trust-store-password=changeit
#server.ssl.client-auth=want

# ─── Logging ─────────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.canet.validator=INFO
