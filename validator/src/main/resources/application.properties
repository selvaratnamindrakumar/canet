# ─── Server ports ────────────────────────────────────────────────────
# Main port — HTTPS when server.ssl.enabled=true (Diosma / middle tier).
# Change to 8080 and set server.ssl.enabled=false for plain HTTP only.
server.port=8443

# Secondary plain-HTTP port — only active when server.ssl.enabled=true.
# Generator and browser health checks use this port (no certificate needed).
# Health:  http://host:8080/api/validator/health
# Exists:  http://host:8080/api/validator/exists?hash=<md5>
server.http.port=8080

# ─── Server SSL ──────────────────────────────────────────────────────
# The middle tier (Diosma) must reach the exists endpoint over HTTPS.
#
# One-time setup — generate a self-signed keystore (run gen-keystore.bat
# or the keytool command below as Administrator):
#
#   keytool -genkeypair -alias canet-validator -keyalg RSA -keysize 2048 ^
#           -validity 3650 -storetype PKCS12 ^
#           -keystore "C:\canet\validator\config\keystore.p12" ^
#           -storepass changeit ^
#           -dname "CN=canet-validator, OU=CaNet, O=CaNet, L=Unknown, ST=Unknown, C=ZA"
#
# The middle tier must import the validator certificate into its truststore:
#
#   keytool -exportcert -alias canet-validator -storetype PKCS12 ^
#           -keystore "C:\canet\validator\config\keystore.p12" ^
#           -storepass changeit -rfc -file canet-validator.crt
#
#   keytool -importcert -noprompt -alias canet-validator ^
#           -file canet-validator.crt ^
#           -keystore "C:\canet\middleware\config\truststore.p12" ^
#           -storetype PKCS12 -storepass changeit
#
server.ssl.enabled=true
server.ssl.key-store=C:/canet/validator/config/keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12

# client-auth controls whether the middle tier must present its own certificate.
#   none — server-only TLS (middle tier trusts the validator cert, no client cert needed)
#   want — request a client cert but allow connections without one
#   need — enforce mutual TLS; middle tier MUST present a valid client certificate
server.ssl.client-auth=none

# Uncomment for mutual TLS (client-auth=need or want):
#server.ssl.trust-store=C:/canet/validator/config/truststore.p12
#server.ssl.trust-store-password=changeit
#server.ssl.trust-store-type=PKCS12

# ─── Diosma notification ─────────────────────────────────────────────
# After every successful DB insert the validator POSTs to Diosma
# asynchronously (does not delay the 201 back to the generator).
# Diosma can then use the fileHash value to call back to:
#   GET /api/validator/exists?hash=<md5>
# Leave diosma.post-url blank to disable notifications.
diosma.post-url=

# HTTP headers sent with every notification.
# Content-Type defaults to application/json when not listed here.
# Add or change headers freely — they all appear in every POST.
diosma.headers.Content-Type=application/json
diosma.headers.X-Application-Id=canet-validator
diosma.headers.X-Source=canet
# diosma.headers.Authorization=Bearer <token>
# diosma.headers.X-Api-Key=<key>
# diosma.headers.X-Correlation-Id=<fixed-or-per-request>

# ─── Database ────────────────────────────────────────────────────────
# ── SQL Server (default) ─────────────────────────────────────────────
# Replace <pipservername>, <PIPfull_name>, and <databaseName> with site values.
# Username / password must be set in config\application.properties (not here).
spring.datasource.url=jdbc:sqlserver://<pipservername>\\<PIPfull_name>;databaseName=<databaseName>;encrypt=false;trustServerCertificate=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=

# ── MySQL alternative — uncomment and comment out the SQL Server block above ──
# spring.datasource.url=jdbc:mysql://localhost:3306/canet?useSSL=false&allowPublicKeyRetrieval=true
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=canet
# spring.datasource.password=canet

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=4
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000

# ─── JPA ─────────────────────────────────────────────────────────────
# none — table dbo.OUTBOUND_FILE already exists; do not let Hibernate alter it
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
# MySQL alternative dialect:
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# ─── Log file location ───────────────────────────────────────────────
# Relative to NSSM AppDirectory (C:\canet\validator).
# Logs written to C:\canet\validator\logs\canet-validator.log
logging.file.name=logs/canet-validator.log

# ─── Rolling policy ──────────────────────────────────────────────────
logging.logback.rollingpolicy.file-name-pattern=logs/canet-validator.%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=20MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=2GB
logging.logback.rollingpolicy.clean-history-on-start=false

# ─── Log format ──────────────────────────────────────────────────────
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %-40.40logger{39} : %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %-40.40logger{39} : %msg%n

# ─── Log levels ──────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.canet.validator=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

# Show generated SQL (useful for debugging):
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
#logging.level.org.springframework.web=DEBUG
